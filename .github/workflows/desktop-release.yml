name: SOrange Cloud Packaging

"on":
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
      release_id:
        description: SOrange backend release id
        required: true
      channel:
        description: Release channel
        required: true
        default: stable
      callback_url:
        description: SOrange backend callback URL
        required: true
      source_revision:
        description: Exact branch, tag, or commit to package
        required: true
        default: main
      target_filter:
        description: Build all targets or recover a single target
        required: true
        type: choice
        default: all
        options:
          - all
          - mac-arm64
          - mac-x64
          - win-x64

permissions:
  contents: read

concurrency:
  group: sorange-desktop-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare cloud build
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.build-matrix.outputs.value }}
      source_sha: ${{ steps.source-commit.outputs.sha }}
    steps:
      - name: Check out release control
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: release-control
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Mark release queued
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_CALLBACK_URL: ${{ inputs.callback_url }}
          RELEASE_CALLBACK_TOKEN: ${{ secrets.RELEASE_CALLBACK_TOKEN }}
          BUILD_RUN_ID: github:${{ github.run_id }}
        run: python release-control/scripts/upload_desktop_release_artifact.py --status queued
      - name: Resolve app source revision
        id: source-checkout
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: Burns1028/sorange
          ref: ${{ inputs.source_revision }}
          token: ${{ secrets.SOURCE_REPOSITORY_TOKEN }}
          path: source
          fetch-depth: 1
      - name: Report invalid app source revision
        if: steps.source-checkout.outcome != 'success'
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_CALLBACK_URL: ${{ inputs.callback_url }}
          RELEASE_CALLBACK_TOKEN: ${{ secrets.RELEASE_CALLBACK_TOKEN }}
          BUILD_RUN_ID: github:${{ github.run_id }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          python release-control/scripts/upload_desktop_release_artifact.py --status failed --error "Unable to resolve Burns1028/sorange@$SOURCE_REVISION"
          exit 1
      - name: Lock app source commit
        id: source-commit
        working-directory: source
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "### App source: Burns1028/sorange@$source_sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Select build targets
        id: build-matrix
        shell: bash
        env:
          TARGET_FILTER: ${{ inputs.target_filter }}
        run: |
          case "$TARGET_FILTER" in
            mac-arm64)
              matrix='{"include":[{"target":"mac-arm64","os":"macos-26","kind":"mac","arch":"arm64","puppeteer_platform":"mac_arm","artifact_glob":"apps/desktop/release/SOrange-*-mac-arm64.dmg"}]}'
              ;;
            mac-x64)
              matrix='{"include":[{"target":"mac-x64","os":"macos-15-intel","kind":"mac","arch":"x64","puppeteer_platform":"mac","artifact_glob":"apps/desktop/release/SOrange-*-mac-x64.dmg"}]}'
              ;;
            win-x64)
              matrix='{"include":[{"target":"win-x64","os":"windows-latest","kind":"windows-package","arch":"x64","artifact_glob":"apps/desktop/release-builder/SOrange-*-win-x64.exe"}]}'
              ;;
            all|"")
              matrix='{"include":[{"target":"mac-arm64","os":"macos-26","kind":"mac","arch":"arm64","puppeteer_platform":"mac_arm","artifact_glob":"apps/desktop/release/SOrange-*-mac-arm64.dmg"},{"target":"mac-x64","os":"macos-15-intel","kind":"mac","arch":"x64","puppeteer_platform":"mac","artifact_glob":"apps/desktop/release/SOrange-*-mac-x64.dmg"},{"target":"win-x64","os":"windows-latest","kind":"windows-package","arch":"x64","artifact_glob":"apps/desktop/release-builder/SOrange-*-win-x64.exe"}]}'
              ;;
            *)
              echo "Unsupported target filter: $TARGET_FILTER" >&2
              exit 1
              ;;
          esac
          echo "value=$matrix" >> "$GITHUB_OUTPUT"
  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    env:
      SORANGE_DESKTOP_VERSION: ${{ inputs.version }}
      SORANGE_DESKTOP_TARGET_ARCH: ${{ matrix.arch }}
      RELEASE_ID: ${{ inputs.release_id }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_CALLBACK_URL: ${{ inputs.callback_url }}
      RELEASE_CALLBACK_TOKEN: ${{ secrets.RELEASE_CALLBACK_TOKEN }}
      BUILD_RUN_ID: github:${{ github.run_id }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      SORANGE_NOTARY_NO_S3_ACCELERATION: "1"
    steps:
      - name: Check out release control
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: release-control

      - name: Check out locked app source
        uses: actions/checkout@v5
        with:
          repository: Burns1028/sorange
          ref: ${{ needs.prepare.outputs.source_sha }}
          token: ${{ secrets.SOURCE_REPOSITORY_TOKEN }}
          path: source
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Mark target building
        run: python release-control/scripts/upload_desktop_release_artifact.py --status building --target "${{ matrix.target }}"

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Apply release version
        working-directory: source
        run: node scripts/set-desktop-release-version.mjs "${{ inputs.version }}"

      - name: Build pinned Windows DeepSeek Harness artifact
        if: matrix.kind == 'windows-package'
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          dsh_artifact="$RUNNER_TEMP/sorange-dsh-artifact-win-x64"
          node scripts/prepare-deepseek-harness-release-artifact.mjs --output "$dsh_artifact"
          echo "SORANGE_DSH_ARTIFACT_DIR=$dsh_artifact" >> "$GITHUB_ENV"

      - name: Warm browser cache
        if: matrix.kind == 'mac'
        working-directory: source
        run: pnpm exec puppeteer browsers install chrome --platform "${{ matrix.puppeteer_platform }}"

      - name: Build, sign, notarize and verify macOS
        if: matrix.kind == 'mac'
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
        working-directory: source
        run: node apps/desktop/scripts/local-github-macos-fallback.mjs --package 2>&1 | tee "$RUNNER_TEMP/sorange-package.log"

      - name: Verify mounted macOS package channel and architecture
        if: matrix.kind == 'mac'
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          dmg="$PWD/apps/desktop/release/SOrange-${SORANGE_DESKTOP_VERSION}-mac-${SORANGE_DESKTOP_TARGET_ARCH}.dmg"
          mount_dir="$(mktemp -d "$RUNNER_TEMP/sorange-release-dmg.XXXXXX")"
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true; rmdir "$mount_dir" 2>/dev/null || true' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
          node - "$mount_dir" "$RELEASE_VERSION" "$RELEASE_CHANNEL" "$SORANGE_DESKTOP_TARGET_ARCH" <<'NODE'
          const {execFileSync} = require('node:child_process');
          const fs = require('node:fs');
          const path = require('node:path');
          const [mountDir, expectedVersion, expectedChannel, targetArch] = process.argv.slice(2);
          const apps = fs.readdirSync(mountDir, {withFileTypes: true})
            .filter((entry) => entry.isDirectory() && entry.name.endsWith('.app'));
          if (apps.length !== 1) throw new Error(`Expected one mounted SOrange app, found ${apps.length}`);
          const manifest = JSON.parse(fs.readFileSync(path.join(
            mountDir, apps[0].name, 'Contents', 'Resources', 'app', 'package.json',
          ), 'utf8'));
          if (manifest.version !== expectedVersion || manifest.sorangeReleaseChannel !== expectedChannel) {
            throw new Error(`macOS package identity mismatch: expected ${expectedVersion}/${expectedChannel}, found ${manifest.version}/${manifest.sorangeReleaseChannel}`);
          }
          const expectedCpuArch = {x64: 'x86_64', arm64: 'arm64'}[targetArch];
          if (!expectedCpuArch) throw new Error(`Unsupported macOS target architecture: ${targetArch}`);
          const executable = path.join(mountDir, apps[0].name, 'Contents', 'MacOS', 'SOrange');
          const actualCpuArch = execFileSync('lipo', ['-archs', executable], {encoding: 'utf8'}).trim();
          if (actualCpuArch !== expectedCpuArch) {
            throw new Error(`macOS package architecture mismatch: expected ${expectedCpuArch}, found ${actualCpuArch}`);
          }
          console.log(`Verified mounted macOS package ${manifest.version}/${manifest.sorangeReleaseChannel}/${actualCpuArch}`);
          NODE
          echo "RELEASE_ARTIFACT_VERIFICATION_STATUS=verified" >> "$GITHUB_ENV"
          echo "RELEASE_ARTIFACT_VERIFICATION_RUN_ID=$BUILD_RUN_ID" >> "$GITHUB_ENV"

      - name: Build and verify Windows installer
        if: matrix.kind == 'windows-package'
        shell: bash
        working-directory: source
        env:
          WINDOWS_CODE_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_BASE64 }}
          WINDOWS_CODE_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/sorange-windows-signing.pfx"
          if [[ -n "${WINDOWS_CODE_SIGNING_PFX_BASE64:-}" && -z "${WINDOWS_CODE_SIGNING_PFX_PASSWORD:-}" ]] || \
             [[ -z "${WINDOWS_CODE_SIGNING_PFX_BASE64:-}" && -n "${WINDOWS_CODE_SIGNING_PFX_PASSWORD:-}" ]]; then
            echo '::error::Windows signing configuration is incomplete: both certificate and password are required.' >&2
            exit 1
          fi
          if [[ -n "${WINDOWS_CODE_SIGNING_PFX_BASE64:-}" ]]; then
            python - "$certificate_path" <<'PY'
          import base64
          import os
          import pathlib
          import sys

          pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(os.environ["WINDOWS_CODE_SIGNING_PFX_BASE64"]))
          PY
            export WIN_CSC_LINK="$certificate_path"
            export WIN_CSC_KEY_PASSWORD="$WINDOWS_CODE_SIGNING_PFX_PASSWORD"
          else
            echo 'No Windows certificate configured; building an unsigned installer for functional validation.'
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD || true
          fi

          pnpm --filter @sorange/desktop build
          export SORANGE_WINDOWS_SKIP_ZIP=1
          node apps/desktop/scripts/package-windows.mjs
          portable_app="$PWD/apps/desktop/release/SOrange-win32-x64"
          builder_overrides=()
          if [[ "$RELEASE_CHANNEL" == beta ]]; then
            numeric_build_version="$(node --input-type=module -e 'import {windowsNumericBuildVersion} from "./apps/desktop/scripts/release-version.mjs"; console.log(windowsNumericBuildVersion(process.env.SORANGE_DESKTOP_VERSION));')"
            builder_overrides+=("--config.buildVersion=$numeric_build_version")
          fi
          pnpm --filter @sorange/desktop exec electron-builder \
            --projectDir . \
            --config electron-builder.yml \
            "${builder_overrides[@]}" \
            --prepackaged "$portable_app" \
            --win nsis \
            --x64 \
            --publish never
          installer="$(find apps/desktop/release-builder -maxdepth 1 -type f -name 'SOrange-*-win-x64.exe' -print -quit)"
          [[ -n "$installer" && -s "$installer" ]] || { echo 'Windows installer was not created' >&2; exit 1; }
          node apps/desktop/scripts/verify-windows-package.mjs --app-dir "$portable_app" --version "$SORANGE_DESKTOP_VERSION" --release-channel "$RELEASE_CHANNEL"
          rm -f "$certificate_path"

      - name: Preserve packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: sorange-${{ inputs.version }}-${{ matrix.target }}
          path: source/${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Upload to the website server and synchronize status
        if: matrix.kind != 'windows-package'
        run: |
          python -m pip install --quiet requests
          python release-control/scripts/upload_desktop_release_artifact.py --status uploaded --target "${{ matrix.target }}" --artifact-glob "source/${{ matrix.artifact_glob }}"

      - name: Report target failure
        if: failure()
        run: python release-control/scripts/upload_desktop_release_artifact.py --status failed --target "${{ matrix.target }}" --error "${{ matrix.target }} cloud build failed"

  validate-windows:
    name: Install and smoke test win-x64
    needs:
      - prepare
      - build
    if: ${{ always() && needs.prepare.result == 'success' && (inputs.target_filter == 'win-x64' || inputs.target_filter == 'all') }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SORANGE_DESKTOP_VERSION: ${{ inputs.version }}
      RELEASE_ID: ${{ inputs.release_id }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_CALLBACK_URL: ${{ inputs.callback_url }}
      RELEASE_CALLBACK_TOKEN: ${{ secrets.RELEASE_CALLBACK_TOKEN }}
      BUILD_RUN_ID: github:${{ github.run_id }}
    steps:
      - name: Check out release control
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: release-control

      - name: Check out locked app source
        uses: actions/checkout@v5
        with:
          repository: Burns1028/sorange
          ref: ${{ needs.prepare.outputs.source_sha }}
          token: ${{ secrets.SOURCE_REPOSITORY_TOKEN }}
          path: source
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download Windows installer
        uses: actions/download-artifact@v5
        with:
          name: sorange-${{ inputs.version }}-win-x64
          path: source/apps/desktop/release-builder

      - name: Install and smoke test Windows package
        shell: pwsh
        working-directory: source
        env:
          WINDOWS_CODE_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_BASE64 }}
          WINDOWS_CODE_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'apps/desktop/release-builder/SOrange-*-win-x64.exe' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer -or $installer.Length -le 0) { throw 'Windows installer was not downloaded' }
          $hasSigningCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGNING_PFX_BASE64) -and
            -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGNING_PFX_PASSWORD)
          $arguments = @{
            InstallerPath = $installer.FullName
            Version = $env:SORANGE_DESKTOP_VERSION
            ReleaseChannel = $env:RELEASE_CHANNEL
            Cycles = 2
          }
          if ($hasSigningCertificate) { $arguments.RequireSignature = $true }
          & 'apps/desktop/scripts/test-windows-installer.ps1' @arguments
          $signatureStatus = if ($hasSigningCertificate) { 'valid' } else { 'unsigned' }
          @(
            'RELEASE_ARTIFACT_VERIFICATION_STATUS=verified'
            "RELEASE_ARTIFACT_VERIFICATION_RUN_ID=$env:BUILD_RUN_ID"
            "RELEASE_ARTIFACT_SIGNATURE_STATUS=$signatureStatus"
            'RELEASE_ARTIFACT_SMOKE_STATUS=passed'
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Preserve Windows smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sorange-${{ inputs.version }}-win-x64-smoke
          path: ${{ runner.temp }}/sorange-smoke-*.png
          if-no-files-found: warn
          retention-days: 3

      - name: Upload verified Windows installer to the website server
        run: |
          python -m pip install --quiet requests
          python release-control/scripts/upload_desktop_release_artifact.py --status uploaded --target win-x64 --artifact-glob "source/apps/desktop/release-builder/SOrange-*-win-x64.exe"

      - name: Report Windows validation failure
        if: failure()
        run: python release-control/scripts/upload_desktop_release_artifact.py --status failed --target win-x64 --error "win-x64 install or smoke validation failed"

  finalize:
    name: Finalize complete desktop release
    needs:
      - prepare
      - build
      - validate-windows
    if: ${{ always() && inputs.target_filter == 'all' && needs.prepare.result == 'success' && needs.build.result == 'success' && needs.validate-windows.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_ID: ${{ inputs.release_id }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_CALLBACK_URL: ${{ inputs.callback_url }}
      RELEASE_CALLBACK_TOKEN: ${{ secrets.RELEASE_CALLBACK_TOKEN }}
      BUILD_RUN_ID: github:${{ github.run_id }}
    steps:
      - name: Check out release control
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: release-control

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Mark complete release succeeded
        run: python release-control/scripts/upload_desktop_release_artifact.py --status succeeded
