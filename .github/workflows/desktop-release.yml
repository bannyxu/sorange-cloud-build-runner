name: SOrange Cloud Packaging

"on":
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
      release_id:
        description: SOrange backend release id
        required: true
      channel:
        description: Release channel
        required: true
        default: stable
      callback_url:
        description: SOrange backend callback URL
        required: true
      source_revision:
        description: Exact branch, tag, or commit to package
        required: true
        default: main
      target_filter:
        description: Build all targets or recover a single target
        required: true
        type: choice
        default: all
        options:
          - all
          - mac-arm64
          - mac-x64
          - win-x64

permissions:
  contents: read

concurrency:
  group: sorange-desktop-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare cloud build
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.build-matrix.outputs.value }}
      source_sha: ${{ steps.source-commit.outputs.sha }}
    steps:
      - name: Check out release control
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: release-control
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Mark release queued
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_CALLBACK_URL: ${{ inputs.callback_url }}
          RELEASE_CALLBACK_TOKEN: ${{ secrets.RELEASE_CALLBACK_TOKEN }}
          BUILD_RUN_ID: github:${{ github.run_id }}
        run: python release-control/scripts/upload_desktop_release_artifact.py --status queued
      - name: Resolve app source revision
        id: source-checkout
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: Burns1028/sorange
          ref: ${{ inputs.source_revision }}
          token: ${{ secrets.SOURCE_REPOSITORY_TOKEN }}
          path: source
          fetch-depth: 1
      - name: Report invalid app source revision
        if: steps.source-checkout.outcome != 'success'
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_CALLBACK_URL: ${{ inputs.callback_url }}
          RELEASE_CALLBACK_TOKEN: ${{ secrets.RELEASE_CALLBACK_TOKEN }}
          BUILD_RUN_ID: github:${{ github.run_id }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          python release-control/scripts/upload_desktop_release_artifact.py --status failed --error "Unable to resolve Burns1028/sorange@$SOURCE_REVISION"
          exit 1
      - name: Lock app source commit
        id: source-commit
        working-directory: source
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "### App source: Burns1028/sorange@$source_sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Select build targets
        id: build-matrix
        shell: bash
        env:
          TARGET_FILTER: ${{ inputs.target_filter }}
        run: |
          case "$TARGET_FILTER" in
            mac-arm64)
              matrix='{"include":[{"target":"mac-arm64","os":"macos-26","kind":"mac","arch":"arm64","puppeteer_platform":"mac_arm","artifact_glob":"apps/desktop/release/SOrange-*-mac-arm64.dmg"}]}'
              ;;
            mac-x64)
              matrix='{"include":[{"target":"mac-x64","os":"macos-15-intel","kind":"mac","arch":"x64","puppeteer_platform":"mac","artifact_glob":"apps/desktop/release/SOrange-*-mac-x64.dmg"}]}'
              ;;
            win-x64)
              matrix='{"include":[{"target":"win-x64","os":"windows-latest","kind":"windows","arch":"x64","artifact_glob":"apps/desktop/release-builder/SOrange-*-win-x64.exe"}]}'
              ;;
            all|"")
              matrix='{"include":[{"target":"mac-arm64","os":"macos-26","kind":"mac","arch":"arm64","puppeteer_platform":"mac_arm","artifact_glob":"apps/desktop/release/SOrange-*-mac-arm64.dmg"},{"target":"mac-x64","os":"macos-15-intel","kind":"mac","arch":"x64","puppeteer_platform":"mac","artifact_glob":"apps/desktop/release/SOrange-*-mac-x64.dmg"},{"target":"win-x64","os":"windows-latest","kind":"windows","arch":"x64","artifact_glob":"apps/desktop/release-builder/SOrange-*-win-x64.exe"}]}'
              ;;
            *)
              echo "Unsupported target filter: $TARGET_FILTER" >&2
              exit 1
              ;;
          esac
          echo "value=$matrix" >> "$GITHUB_OUTPUT"
  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    env:
      SORANGE_DESKTOP_VERSION: ${{ inputs.version }}
      SORANGE_DESKTOP_TARGET_ARCH: ${{ matrix.arch }}
      RELEASE_ID: ${{ inputs.release_id }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_CALLBACK_URL: ${{ inputs.callback_url }}
      RELEASE_CALLBACK_TOKEN: ${{ secrets.RELEASE_CALLBACK_TOKEN }}
      BUILD_RUN_ID: github:${{ github.run_id }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      SORANGE_NOTARY_NO_S3_ACCELERATION: "1"
    steps:
      - name: Check out release control
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: release-control

      - name: Check out locked app source
        uses: actions/checkout@v5
        with:
          repository: Burns1028/sorange
          ref: ${{ needs.prepare.outputs.source_sha }}
          token: ${{ secrets.SOURCE_REPOSITORY_TOKEN }}
          path: source
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Mark target building
        run: python release-control/scripts/upload_desktop_release_artifact.py --status building --target "${{ matrix.target }}"

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Apply release version
        working-directory: source
        run: node scripts/set-desktop-release-version.mjs "${{ inputs.version }}"

      - name: Warm browser cache
        if: matrix.kind == 'mac'
        working-directory: source
        run: pnpm exec puppeteer browsers install chrome --platform "${{ matrix.puppeteer_platform }}"

      - name: Build, sign, notarize and verify macOS
        if: matrix.kind == 'mac'
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
        working-directory: source
        run: node apps/desktop/scripts/local-github-macos-fallback.mjs --package 2>&1 | tee "$RUNNER_TEMP/sorange-package.log"

      - name: Build and verify Windows installer
        if: matrix.kind == 'windows'
        shell: pwsh
        working-directory: source
        env:
          WINDOWS_CODE_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_BASE64 }}
          WINDOWS_CODE_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $hasSigningCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGNING_PFX_BASE64) -and
            -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGNING_PFX_PASSWORD)
          $certificatePath = Join-Path $env:RUNNER_TEMP 'sorange-windows-signing.pfx'
          if ($hasSigningCertificate) {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CODE_SIGNING_PFX_BASE64))
            $env:WIN_CSC_LINK = $certificatePath
            $env:WIN_CSC_KEY_PASSWORD = $env:WINDOWS_CODE_SIGNING_PFX_PASSWORD
          } else {
            Write-Warning 'Windows signing secrets are not configured. Building a functionally verified unsigned installer.'
            Remove-Item Env:WIN_CSC_LINK -ErrorAction SilentlyContinue
            Remove-Item Env:WIN_CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          }

          pnpm --filter @sorange-v2/desktop build
          if ($LASTEXITCODE -ne 0) { throw "Desktop build failed with exit code $LASTEXITCODE" }

          $env:SORANGE_WINDOWS_SKIP_ZIP = '1'
          node apps/desktop/scripts/package-windows.mjs
          if ($LASTEXITCODE -ne 0) { throw "Complete Windows app packaging failed with exit code $LASTEXITCODE" }

          $portableApp = Resolve-Path 'apps/desktop/release/SOrange-win32-x64'
          $portableExecutable = Join-Path $portableApp 'SOrange.exe'
          if ($hasSigningCertificate) {
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signTool) { throw 'signtool.exe was not found on the Windows runner' }
            & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certificatePath /p $env:WINDOWS_CODE_SIGNING_PFX_PASSWORD $portableExecutable
            if ($LASTEXITCODE -ne 0) { throw "SOrange.exe signing failed with exit code $LASTEXITCODE" }
          }

          pnpm --filter @sorange-v2/desktop exec electron-builder `
            --projectDir . `
            --config electron-builder.yml `
            --prepackaged $portableApp `
            --win nsis `
            --x64 `
            --publish never
          if ($LASTEXITCODE -ne 0) { throw "Windows installer packaging failed with exit code $LASTEXITCODE" }

          $installer = Get-ChildItem 'apps/desktop/release-builder/SOrange-*-win-x64.exe' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer -or $installer.Length -le 0) { throw 'Windows installer was not created' }

          node apps/desktop/scripts/verify-windows-package.mjs --app-dir $portableApp --version $env:SORANGE_DESKTOP_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Windows package structure verification failed with exit code $LASTEXITCODE" }
          if ($hasSigningCertificate) {
            & 'apps/desktop/scripts/verify-windows-authenticode.ps1' -FilePath @($portableExecutable, $installer.FullName)
          }

          $installDir = Join-Path $env:RUNNER_TEMP 'SOrange-installed'
          if (Test-Path $installDir) { Remove-Item -LiteralPath $installDir -Recurse -Force }
          $installProcess = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { throw "Silent installer failed with exit code $($installProcess.ExitCode)" }

          $installedExecutable = Join-Path $installDir 'SOrange.exe'
          if (-not (Test-Path $installedExecutable)) { throw "Installed SOrange.exe was not found at $installedExecutable" }
          node apps/desktop/scripts/verify-windows-package.mjs --app-dir $installDir --version $env:SORANGE_DESKTOP_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Installed package verification failed with exit code $LASTEXITCODE" }
          if ($hasSigningCertificate) {
            & 'apps/desktop/scripts/verify-windows-authenticode.ps1' -FilePath @($installedExecutable, $installer.FullName)
          }

          $env:SORANGE_DESKTOP_PACKAGED_EXECUTABLE = $installedExecutable
          $env:SORANGE_DESKTOP_USER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'sorange-smoke-user-data'
          $env:SORANGE_DESKTOP_SMOKE_SCREENSHOT = Join-Path $env:RUNNER_TEMP 'sorange-smoke.png'
          $env:SORANGE_DESKTOP_SMOKE_TIMEOUT_MS = '120000'
          pnpm --filter @sorange-v2/desktop smoke:packaged
          if ($LASTEXITCODE -ne 0) { throw "Installed app smoke failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $env:SORANGE_DESKTOP_SMOKE_SCREENSHOT)) { throw 'Installed app smoke screenshot was not created' }

          $signatureStatus = if ($hasSigningCertificate) { 'valid' } else { 'unsigned' }
          @(
            'RELEASE_ARTIFACT_VERIFICATION_STATUS=verified'
            "RELEASE_ARTIFACT_SIGNATURE_STATUS=$signatureStatus"
            'RELEASE_ARTIFACT_SMOKE_STATUS=passed'
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          if (Test-Path $certificatePath) { Remove-Item -LiteralPath $certificatePath -Force }

      - name: Preserve packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: sorange-${{ inputs.version }}-${{ matrix.target }}
          path: source/${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Upload to the website server and synchronize status
        run: |
          python -m pip install --quiet requests
          python release-control/scripts/upload_desktop_release_artifact.py --status uploaded --target "${{ matrix.target }}" --artifact-glob "source/${{ matrix.artifact_glob }}"

      - name: Report target failure
        if: failure()
        run: python release-control/scripts/upload_desktop_release_artifact.py --status failed --target "${{ matrix.target }}" --error "${{ matrix.target }} cloud build failed"
