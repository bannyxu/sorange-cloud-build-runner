name: SOrange Windows Installer E2E

"on":
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact Burns1028/sorange branch, tag, or commit to test
        required: true
      version:
        description: Test package version
        required: true
        default: 2.0.17-test.1
      cycles:
        description: Install/upgrade/uninstall cycles per Windows runner
        required: true
        type: choice
        default: "2"
        options:
          - "1"
          - "2"
          - "3"
      previous_installer_url:
        description: Optional previous SOrange installer URL for a cross-version upgrade test
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: sorange-windows-installer-e2e-${{ inputs.source_revision }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned validation installer
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      SORANGE_DESKTOP_VERSION: ${{ inputs.version }}
      SORANGE_DESKTOP_TARGET_ARCH: x64
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out app source
        uses: actions/checkout@v5
        with:
          repository: Burns1028/sorange
          ref: ${{ inputs.source_revision }}
          token: ${{ secrets.SOURCE_REPOSITORY_TOKEN }}
          path: source
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Apply test version
        working-directory: source
        run: node scripts/set-desktop-release-version.mjs "${{ inputs.version }}"

      - name: Build unsigned installer for functional validation only
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @sorange-v2/desktop build
          export SORANGE_WINDOWS_SKIP_ZIP=1
          node apps/desktop/scripts/package-windows.mjs
          portable_app="$PWD/apps/desktop/release/SOrange-win32-x64"
          pnpm --filter @sorange-v2/desktop exec electron-builder \
            --projectDir . \
            --config electron-builder.yml \
            --prepackaged "$portable_app" \
            --win nsis \
            --x64 \
            --publish never

      - name: Upload validation installer
        uses: actions/upload-artifact@v4
        with:
          name: sorange-windows-installer-e2e
          path: source/apps/desktop/release-builder/SOrange-*-win-x64.exe
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  validate:
    name: ${{ matrix.os }} default install and upgrade
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-2025
    steps:
      - name: Check out app source
        uses: actions/checkout@v5
        with:
          repository: Burns1028/sorange
          ref: ${{ inputs.source_revision }}
          token: ${{ secrets.SOURCE_REPOSITORY_TOKEN }}
          path: source
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download validation installer
        uses: actions/download-artifact@v5
        with:
          name: sorange-windows-installer-e2e
          path: source/apps/desktop/release-builder

      - name: Download previous installer for cross-version upgrade
        if: inputs.previous_installer_url != ''
        shell: pwsh
        working-directory: source
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'SOrange-previous-win-x64.exe'
          Invoke-WebRequest -Uri '${{ inputs.previous_installer_url }}' -OutFile $destination -MaximumRetryCount 3 -RetryIntervalSec 5
          if (-not (Test-Path -LiteralPath $destination) -or (Get-Item -LiteralPath $destination).Length -le 0) {
            throw 'Previous Windows installer was not downloaded'
          }
          "SORANGE_PREVIOUS_INSTALLER=$destination" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test default install, running upgrade, smoke, and uninstall
        shell: pwsh
        working-directory: source
        run: |
          $installer = Get-ChildItem 'apps/desktop/release-builder/SOrange-*-win-x64.exe' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not downloaded' }
          $arguments = @{
            InstallerPath = $installer.FullName
            Version = '${{ inputs.version }}'
            Cycles = ${{ inputs.cycles }}
          }
          if (-not [string]::IsNullOrWhiteSpace($env:SORANGE_PREVIOUS_INSTALLER)) {
            $arguments.PreviousInstallerPath = $env:SORANGE_PREVIOUS_INSTALLER
          }
          & 'apps/desktop/scripts/test-windows-installer.ps1' @arguments

      - name: Stage installer trace
        if: always()
        shell: pwsh
        run: |
          $trace = Join-Path $env:TEMP 'sorange-installer-trace.log'
          if (Test-Path -LiteralPath $trace) {
            Copy-Item -LiteralPath $trace -Destination (Join-Path $env:RUNNER_TEMP 'sorange-installer-trace.log') -Force
          }

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sorange-windows-installer-e2e-${{ matrix.os }}-smoke
          path: |
            ${{ runner.temp }}/sorange-smoke-*.png
            ${{ runner.temp }}/sorange-installer-trace.log
          if-no-files-found: warn
          retention-days: 2
